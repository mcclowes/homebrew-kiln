name: Check Kiln cask

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: kiln-tap-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    name: Cask checks
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Set up stable Homebrew and the current tap checkout
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - name: Check cask style
        run: brew style Casks/kiln.rb
      - name: Audit the cask
        run: brew audit --cask --strict mcclowes/kiln/kiln
      - name: Fetch and verify the archive checksum
        run: brew fetch --cask mcclowes/kiln/kiln
